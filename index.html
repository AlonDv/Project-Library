<!DOCTYPE html>
<html lang="en">
<template id="cardTemplate">
  <div class="bookCard">
    <div class="picture">
      <img src="bookIcon2.png" alt="Closed brown book icon" height="150px" width="auto">
    </div>
    <div class="text">
      <div class="information">
        <p class="title">The Hobbit</p>
        <p class="author">J.R.R. Tolkien</p>
        <p class="pages">295 pages</p>
      </div>
      <div class="readDisplay">
        <div class="iconDiv">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <p class="readParagraph">
          Read
        </p>
      </div>
    </div>
    <div class="buttons">
      <button class="toggleReadBtn"><i class="fa-solid fa-arrows-rotate"></i> Toggle Read</button>
      <button class="removeBtn"><i class="fa-solid fa-trash-can"></i> Remove</button>
    </div>
  </div>
</template>

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <script src="https://kit.fontawesome.com/42f5a0dea4.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <header class="header">
    <div class="logo"><i class="fa-solid fa-book-open"></i> My Library</div>
    <div class="buttonDiv">
      <button class="newBookBtn"><i class="fa-solid fa-plus"></i> New Book </button>
    </div>
  </header>
  <div class="bookContainer"> </div>
  <form class="form">
    <div class="upper">
      <div class="pair">
        <label for="title">Title*</label><br>
        <input type="text" placeholder="Enter book title" required id="title" name="title">
      </div>
      <div class="pair">
        <label for="author">Author*</label><br>
        <input type="text" name="author" id="author" required placeholder="Enter author name">
      </div>
    </div>
    <div class="middle">
      <div class="pair">
        <label for="pages">Pages*</label><br>
        <input type="number" name="pages" id="pages" placeholder="e.g 320" required>
      </div>
      <div class="pair">
        <label for="read">Status</label><br>
        <select name="read" id="read">
          <option value="true">Read</option>
          <option value="false">Unread</option>
        </select>
      </div>
    </div>
    <div class="bottom">
      <button class="cancelBtn" type="button">Cancel</button>
      <button class="addBookBtn" type="submit">Add Book</button>
    </div>
  </form>
  <script src="script.js"></script>
</body>

</html>
